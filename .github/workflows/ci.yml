name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1/generated_project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-inc/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: ai_in_se_chapter_04
          auto-activate-environment: true
          python-version: "3.11"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONPATH: .
