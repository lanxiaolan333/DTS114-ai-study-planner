# Conda environment for Task 1 notebook and Flask project (Python 3.11)
# Create: conda env create -f environment.yml
# Activate: conda activate ai_in_se_chapter_04

name: ai_in_se_chapter_04
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - flask>=3.1
  - pip
  - pip:
      - annotated-types==0.7.0
      - anyio==4.13.0
      - certifi==2026.5.20
      - charset-normalizer==3.4.7
      - flask-cors==6.0.2
      - gunicorn==23.0.0
      - httpx==0.28.1
      - ipykernel==6.31.0
      - openai==2.40.0
      - pillow==12.2.0
      - pluggy==1.6.0
      - pytest==8.4.2
      - python-dotenv==1.2.2
      - requests==2.34.2
